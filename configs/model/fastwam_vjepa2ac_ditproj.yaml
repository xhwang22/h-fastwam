# FastWAM model config with V-JEPA 2-AC visual encoder (DiT-side projection)
#
# Same recipe as fastwam_dino_ditproj.yaml, but swaps the DINO ViT for the
# V-JEPA 2-AC ViT-g/16 encoder (action-conditioned variant, post-trained on
# ~62h of Droid robot interaction data).  skip_projection=True sends raw
# V-JEPA 2-AC features directly to the DiT patchify Conv3d — no MLP bottleneck.
#
# Checkpoint is fetched via torch.hub the first time the encoder is built;
# after that it's cached under ~/.cache/torch/hub/.  Set
#   checkpoint_source: local
#   checkpoint_path: /path/to/vjepa2-ac-vitg.pt
# to load offline from a pre-downloaded file (direct URL:
# https://dl.fbaipublicfiles.com/vjepa2/vjepa2-ac-vitg.pt).
#
# IMPORTANT: ViT-g hidden dim is 1408 (EVA-g convention). The DiT in_dim /
# out_dim must match the encoder hidden_dim since skip_projection=True.
# If a future AC variant uses a different hidden_dim, update in_dim/out_dim
# accordingly.
#
# Requires a pretrain_checkpoint to initialise the patchify/head layers
# (which are randomly initialised because their shapes no longer match
# the original VAE-pretrained Wan2.2 weights).

_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: /apdcephfs_gy2/share_302533218/shaunxhwang/embodied/world_model/fastwam/checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt

skip_video_dit_load_from_pretrain: false
skip_dit_load_from_pretrain: false

# Load continue-pretrained checkpoint (DiT + visual encoder weights)
# Point this at the output of a V-JEPA2-AC pretrain run (mirror of
# pretrain_dino_ditproj) once available.
pretrain_checkpoint: null

# V-JEPA 2-AC visual encoder with DiT-side projection (no MLP bottleneck)
visual_encoder:
  encoder_type: vjepa2_ac
  model_name: vjepa2_ac_vit_giant
  checkpoint_source: torch_hub      # "torch_hub" (auto-download) or "local"
  checkpoint_path: null             # set when checkpoint_source=local
  skip_projection: true             # Raw V-JEPA2-AC features → DiT patchify directly
  freeze_backbone: true
  spatial_downsample: 16
  temporal_downsample: 4
  standardise_output: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 1408             # V-JEPA 2-AC ViT-g hidden dim
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 1408            # FM target in V-JEPA 2-AC feature space
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
  action_loss_detach_video_expert: true
