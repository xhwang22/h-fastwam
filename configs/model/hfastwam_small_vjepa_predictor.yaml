# Model config: H-FastWAM SMALL + V-JEPA 2-AC — Experiment 3: JEPAPredictor.
#
# Experiment 3 differs from Experiment 2 (hfastwam_small_vjepa.yaml) in that
# the video expert is a **JEPAPredictor** (deterministic next-frame latent
# predictor, L1 regression in V-JEPA 2-AC encoder space) rather than a
# Wan-style flow-matching DiT.
#
# Architecture:
#   - Language expert : frozen Qwen3-VL-2B (16 heads × 128 = 2048, 28 layers)
#   - Video expert    : JEPAPredictor — aligned to language (16 heads × 128 =
#                       2048, 28 layers, RANDOM-INIT). No flow matching;
#                       trained with L1 loss on V-JEPA 2-AC encoder latents.
#   - Action expert   : ActionDiT — aligned to language (same geometry),
#                       random-init, flow-matching denoiser as usual.
#   - Visual encoder  : frozen V-JEPA 2-AC ViT-g/16 (1408-dim raw features,
#                       skip_projection=true → straight to JEPAPredictor patchify)
#
# No WAN / ActionDiT pretrained weights are loaded (skip_*_load_from_pretrain).
# MoT projection adapters collapse to identity (all experts share 16×128=2048).
#
# Memory profile: ~3.8B trainable params (same as hfastwam_small_vjepa),
# video expert is deterministic → no noise tensors / scheduler overhead.
#
# Usage:
#   model=hfastwam_small_vjepa_predictor
#   model.video_expert_type=jepa_predictor   # already set below via _target_

_target_: fastwam.models.hfastwam.hfastwam.HFastWAM.from_pretrained_fastwam

fastwam_checkpoint: null

model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
proprio_dim: ${data.train.processor.proprio_output_dim}

# Select JEPAPredictor as the video expert (Experiment 3).
# The factory will call load_wan22_ti2v_5b_components(skip_dit_build=True, ...)
# and build JEPAPredictor from video_dit_config (WAN-specific keys are filtered).
video_expert_type: jepa_predictor

# Random-init: no WAN DiT or ActionDiT pretrained weights.
skip_video_dit_load_from_pretrain: true
skip_dit_load_from_pretrain: true

# V-JEPA 2-AC ViT-g visual encoder (frozen), raw 1408-d features.
visual_encoder_config:
  encoder_type: vjepa2_ac
  model_name: vjepa2_ac_vit_giant
  checkpoint_source: torch_hub
  checkpoint_path: null  # set to local path of vjepa2-ac-vitg.pt
  skip_projection: true     # raw 1408-d features → JEPAPredictor patchify directly
  freeze_backbone: true
  spatial_downsample: 16
  temporal_downsample: 4
  standardise_output: true    # normalise per-channel before JEPAPredictor patchify (matches DINO)

visual_encoder: null

language_vocab_size: 32000
language_max_task_len: 128
language_max_subtask_len: 128

knowledge_insulation: true
action_loss_detach_video_expert: false  # action-loss grad flows into video expert (matches original FastWAM; no detach)

strict_expert_compat: false
layer_alignment_mode: "tail_overlap"
shared_attention_expert: "video"

freeze_language_expert: false
freeze_video_expert: false    # train video expert; override to true only for ablations
freeze_action_expert: false

language_backend: "qwen3"
language_model_id: "Qwen/Qwen3-VL-2B-Instruct"
language_local_files_only: true   # load from HF_HOME cache (checkpoints/hf_cache), no network

# JEPAPredictor config — SMALL, aligned to language (16×128=2048, 28 layers).
# Keys unsupported by JEPAPredictor (has_image_input, freq_dim, etc.) are
# filtered by from_pretrained_fastwam before construction.
# in_dim / out_dim = 1408: predict in V-JEPA 2-AC encoder-latent space.
video_dit_config:
  patch_size: [1, 2, 2]
  in_dim: 1408              # V-JEPA 2-AC ViT-g encoder output dim
  out_dim: 1408             # predict latents back in encoder space
  hidden_dim: 2048          # aligned to language (16 × 128 = 2048)
  ffn_dim: 8192             # 4 × hidden_dim
  text_dim: 4096            # cross-attn dim for proprio / text context
  num_heads: 16             # aligned to language → no MoT q/k/v/o adapters
  attn_head_dim: 128        # 16 × 128 = 2048, aligned to language
  num_layers: 28            # aligned to language
  eps: 1.0e-06
  video_attention_mask_mode: "per_frame_causal"   # JEPA default
  action_group_causal_mask_mode: "group_diagonal"
  use_gradient_checkpointing: true
  use_text_context: true    # receive proprio/text cross-attention conditioning

# Action DiT — SMALL (2048/16/28), random-init, flow-matching denoiser.
action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 2048
  ffn_dim: 8192
  num_heads: 16
  attn_head_dim: 128
  num_layers: 28
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: true

action_dit_pretrained_path: null

# Video scheduler is unused for JEPAPredictor (no flow matching).
video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss_config:
  lambda_language: 1.0
  lambda_video: 1.0
  lambda_action: 1.0
