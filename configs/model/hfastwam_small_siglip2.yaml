# H-FastWAM SMALL with the Qwen3-VL-2B visual tower as the world-model encoder.
#
# The visual tower was initialized from SigLIP2 during Qwen3-VL training, but it
# is used here as an independent frozen encoder. No visual features are routed
# into the language expert. Raw 1024-d patch tokens feed the Wan-style video DiT.

_target_: fastwam.models.hfastwam.hfastwam.HFastWAM.from_pretrained_fastwam

fastwam_checkpoint: null

model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
proprio_dim: ${data.train.processor.proprio_output_dim}

skip_video_dit_load_from_pretrain: true
skip_dit_load_from_pretrain: true

visual_encoder_config:
  encoder_type: qwen3_vl_vision
  model_name: Qwen/Qwen3-VL-2B-Instruct
  local_files_only: true
  skip_projection: true
  freeze_backbone: true
  spatial_downsample: 16
  temporal_downsample: 4
  standardise_output: true

visual_encoder: null

language_vocab_size: 32000
language_max_task_len: 128
language_max_subtask_len: 128

knowledge_insulation: true
action_loss_detach_video_expert: false

strict_expert_compat: false
layer_alignment_mode: "tail_overlap"
shared_attention_expert: "video"

freeze_language_expert: false
freeze_video_expert: false
freeze_action_expert: false

language_backend: "qwen3"
language_model_id: "Qwen/Qwen3-VL-2B-Instruct"
language_local_files_only: true

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 1024
  hidden_dim: 2048
  ffn_dim: 8192
  freq_dim: 256
  text_dim: 4096
  out_dim: 1024
  num_heads: 16
  attn_head_dim: 128
  num_layers: 28
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: true
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 2048
  ffn_dim: 8192
  num_heads: 16
  attn_head_dim: 128
  num_layers: 28
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: true

action_dit_pretrained_path: null

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss_config:
  lambda_language: 1.0
  lambda_video: 1.0
  lambda_action: 1.0
