# DreamDojo latent actions replace the video reconstruction target. The raw
# ActionDiT remains a separate MoT expert and attends to all latent-action tokens.

_target_: fastwam.models.hfastwam.hfastwam_latent_action.HFastWAMLatentAction.from_pretrained_fastwam

fastwam_checkpoint: null

model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
proprio_dim: ${data.train.processor.proprio_output_dim}

video_expert_type: latent_action_dit
skip_video_dit_load_from_pretrain: true
skip_dit_load_from_pretrain: true
fixed_target_encoder: false

visual_encoder_config:
  encoder_type: vjepa2_1
  model_name: vjepa2_1_vit_gigantic_384
  checkpoint_source: local
  checkpoint_path: checkpoints/torch_hub/hub/checkpoints/vjepa2_1_vitG_384.pt
  repo_path: checkpoints/torch_hub/hub/facebookresearch_vjepa2_main
  skip_projection: true
  freeze_backbone: true
  spatial_downsample: 16
  temporal_downsample: 4
  standardise_output: true
  normalise_stats_path: null
  causal_tubelet_encoding: true

visual_encoder: null

dreamdojo_config:
  enabled: true
  root: ${oc.env:DREAMDOJO_ROOT,external/DreamDojo}
  checkpoint: ${oc.env:DREAMDOJO_CHECKPOINT,external/DreamDojo/checkpoints/DreamDojo/LAM_400k.ckpt}
  checkpoint_sha256: d77bf1b307b6e6d0a2800a2636afee8223a7bf19f15a8583eebd3f8979f1c44f
  source_revision: 02f119b759d5c7f84a399fdeea3c6e82e7ed6cff
  pair_batch_size: 32
  dtype: bfloat16

language_vocab_size: 32000
language_max_task_len: 128
language_max_subtask_len: 128

knowledge_insulation: false
action_loss_detach_video_expert: false

strict_expert_compat: false
layer_alignment_mode: tail_overlap
shared_attention_expert: video

freeze_language_expert: true
freeze_video_expert: false
freeze_action_expert: false

language_backend: qwen3
language_model_id: Qwen/Qwen3-VL-2B-Instruct
language_local_files_only: true

video_dit_config:
  latent_dim: 32
  latent_horizon: 32
  context_dim: 1664
  context_spatial_pool: 2
  hidden_dim: 2048
  ffn_dim: 8192
  text_dim: 1664
  num_heads: 16
  attn_head_dim: 128
  num_layers: 28
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: true

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 2048
  ffn_dim: 8192
  num_heads: 16
  attn_head_dim: 128
  num_layers: 28
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: true

action_dit_pretrained_path: null

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
  sampling_distribution: shifted_uniform
  logit_mean: 0.0
  logit_std: 1.0

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
  sampling_distribution: shifted_uniform
  logit_mean: 0.0
  logit_std: 1.0

loss_config:
  lambda_language: 0.0
  lambda_video: 1.0
  lambda_action: 1.0
