# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4
dataloader_timeout: 0
dataloader_prefetch_factor: null
dataloader_persistent_workers: false
dataloader_multiprocessing_context: null

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
eval_every: 50
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null
trainable_components: [dit]
visual_encoder_lr_multiplier: 1.0

# Optional persistent frozen visual-encoder cache. When enabled, training first
# fills missing BF16 safetensors shards, then bypasses the encoder on every step.
video_latent_cache:
  enabled: false
  root: null
  shard_size: 32
  batch_size: 1
  num_workers: 4
  dtype: bf16
  drop_train_video: true
  include_val: false

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
